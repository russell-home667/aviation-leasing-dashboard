name: Update AI Bubble Market & Liquidity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_ai_market_liquidity.py'
      - '.github/workflows/update-ai-market-liquidity.yml'
  schedule:
    # All times are Beijing Time (Asia/Shanghai).
    # U.S. market/Fed observations become available on the following BJT date,
    # hence Tue-Sat morning schedules for Mon-Fri U.S. sessions.
    - cron: '30 5 * * 2-6'
      timezone: 'Asia/Shanghai'
    - cron: '15 6 * * 2-6'
      timezone: 'Asia/Shanghai'
    - cron: '30 6 * * 2-6'
      timezone: 'Asia/Shanghai'
    - cron: '0 8 * * 2-6'
      timezone: 'Asia/Shanghai'
    - cron: '0 9 * * 2-6'
      timezone: 'Asia/Shanghai'
    # ICE BofA OAS series generally update during the following U.S. business day.
    - cron: '30 22 * * 1-5'
      timezone: 'Asia/Shanghai'
    - cron: '30 23 * * 1-5'
      timezone: 'Asia/Shanghai'
    - cron: '30 0 * * 2-6'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: ai-bubble-market-liquidity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'pandas>=2.2' 'numpy>=2.0' 'requests>=2.32' 'yfinance>=0.2.65'

      - name: Resolve update groups
        id: groups
        shell: bash
        run: |
          EVENT='${{ github.event_name }}'
          SCHEDULE='${{ github.event.schedule }}'

          if [[ "$EVENT" == "workflow_dispatch" || "$EVENT" == "push" ]]; then
            GROUPS_TO_RUN='all'
          else
            case "$SCHEDULE" in
              '30 5 * * 2-6') GROUPS_TO_RUN='macro' ;;
              '15 6 * * 2-6') GROUPS_TO_RUN='market' ;;
              '30 6 * * 2-6') GROUPS_TO_RUN='macro vix' ;;
              '0 8 * * 2-6') GROUPS_TO_RUN='macro' ;;
              '0 9 * * 2-6') GROUPS_TO_RUN='vix' ;;
              '30 22 * * 1-5'|'30 23 * * 1-5'|'30 0 * * 2-6') GROUPS_TO_RUN='credit' ;;
              *) GROUPS_TO_RUN='all' ;;
            esac
          fi

          echo "groups=$GROUPS_TO_RUN" >> "$GITHUB_OUTPUT"
          echo "Will run: $GROUPS_TO_RUN"

      - name: Update data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for group in ${{ steps.groups.outputs.groups }}; do
            echo "=== Updating $group ==="
            python scripts/update_ai_market_liquidity.py --group "$group"
          done

      - name: Validate generated module
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/ai_bubble/market_liquidity/latest.json')
          if not p.exists():
              raise SystemExit('latest.json was not generated')
          d = json.loads(p.read_text(encoding='utf-8'))
          indicators = d.get('indicators', {})
          print('Generated indicators:', ', '.join(sorted(indicators)))
          if not indicators:
              raise SystemExit('No indicators available')
          PY

      - name: Commit refreshed data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ai_bubble/market_liquidity/

          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
            exit 0
          fi

          git commit -m 'data: refresh AI bubble market liquidity'
          git pull --rebase origin main
          git push origin HEAD:main
