name: Update AI Compute Fundamentals

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_ai_compute_fundamentals.py'
      - 'data/ai_bubble/compute_fundamentals/nvda_official_overrides.csv'
      - '.github/workflows/update-ai-compute-fundamentals.yml'
  schedule:
    # Beijing Time (Asia/Shanghai)
    - cron: '0 9 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '40 13 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '10 14 * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: ai-compute-fundamentals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'pandas>=2.2' 'requests>=2.32' 'yfinance>=0.2.65' 'lxml>=5.0'

      - name: Resolve update group
        id: group
        shell: bash
        run: |
          EVENT='${{ github.event_name }}'
          SCHEDULE='${{ github.event.schedule }}'
          if [[ "$EVENT" == "workflow_dispatch" || "$EVENT" == "push" ]]; then
            GROUP='all'
          else
            case "$SCHEDULE" in
              '0 9 * * *') GROUP='nvda' ;;
              '40 13 * * *'|'10 14 * * *') GROUP='tsmc' ;;
              *) GROUP='all' ;;
            esac
          fi
          echo "group=$GROUP" >> "$GITHUB_OUTPUT"
          echo "Will update: $GROUP"

      - name: Update compute fundamentals
        run: |
          set -euo pipefail
          python scripts/update_ai_compute_fundamentals.py --group '${{ steps.group.outputs.group }}'

      - name: Validate generated module
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/ai_bubble/compute_fundamentals/latest.json')
          if not p.exists():
              raise SystemExit('latest.json missing')
          d = json.loads(p.read_text(encoding='utf-8'))
          if d.get('errors'):
              raise SystemExit(f"Pipeline errors: {d['errors']}")
          n = d.get('nvda') or {}
          t = d.get('tsmc') or {}
          required_nvda = ['data_center_revenue_usd_bn','gross_margin_pct','inventory_usd_bn','inventory_days','accounts_receivable_usd_bn','dso_days']
          missing = [k for k in required_nvda if n.get(k) is None]
          if missing:
              raise SystemExit(f'NVDA latest missing fields: {missing}')
          if t.get('revenue_twd_mn') is None or t.get('yoy_pct_reported') is None or t.get('rolling_3m_yoy_pct') is None:
              raise SystemExit('TSMC latest is incomplete')
          print('NVDA latest:', n)
          print('TSMC latest:', t)
          PY

      - name: Commit refreshed data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ai_bubble/compute_fundamentals/
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
            exit 0
          fi
          git commit -m 'data: refresh AI compute fundamentals'
          git pull --rebase origin main
          git push origin HEAD:main
