name: Backtest AI Scores

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/backtest_ai_scores.py'
      - 'scripts/apply_ai_calibration.py'
      - '.github/workflows/backtest-ai-scores.yml'
  schedule:
    - cron: '15 1 1 * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: ai-score-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'pandas>=2.2' 'numpy>=2.0'

      - name: Run historical backtest
        run: |
          set -euo pipefail
          python scripts/backtest_ai_scores.py
          python scripts/apply_ai_calibration.py

      - name: Validate output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/ai_bubble/backtest_calibration/latest.json')
          if not p.exists():
              raise SystemExit('backtest latest.json missing')
          d = json.loads(p.read_text(encoding='utf-8'))
          if d.get('errors'):
              raise SystemExit(f"Backtest errors: {d['errors']}")
          if len(d.get('events', [])) < 5:
              raise SystemExit('Event summary incomplete')
          c = d.get('calibration_conclusion', {})
          if c.get('status') != 'hybrid_v2_applied':
              raise SystemExit('Calibrated bands were not applied')
          print('Percentiles:', d['breakdown_proxy_percentiles'])
          print('Band validation:', d['live_band_validation'])
          print('Calibration:', c)
          print('Events:', d['events'])
          PY

      - name: Commit backtest outputs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ai_bubble/backtest_calibration/ data/ai_bubble/top_scores/
          if git diff --cached --quiet; then
            echo 'No backtest changes to commit.'
            exit 0
          fi
          git commit -m 'data: refresh calibrated AI score backtest'
          git pull --rebase origin main
          git push origin HEAD:main
