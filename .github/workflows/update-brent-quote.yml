name: Check Brent Quote

on:
  workflow_dispatch:

  # GitHub Actions' shortest supported scheduled interval is 5 minutes.
  # Run every day in Beijing time. The updater writes only when Yahoo Finance
  # publishes a new BZ=F source bar, so closed-market checks remain no-op runs.
  schedule:
    - cron: '*/5 * * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-data-and-pages
  cancel-in-progress: false

jobs:
  check-brent-quote:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check latest Yahoo Finance BZ=F 1-minute bar
        run: python scripts/update_brent_quote.py

      - name: Detect quote change
        id: detect
        run: |
          if git diff --quiet -- data/market_data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new Brent quote."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New Brent quote detected."
          fi

      - name: Commit updated Brent quote
        if: steps.detect.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_data.json
          git commit -m "Update Brent quote"
          git pull --rebase origin main
          git push origin main

      - name: Setup Pages
        if: steps.detect.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.detect.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: steps.detect.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
