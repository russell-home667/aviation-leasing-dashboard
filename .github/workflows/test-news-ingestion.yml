name: Test News Ingestion - Step 1

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_news_raw.py'
      - 'data/news_sources.json'
      - '.github/workflows/test-news-ingestion.yml'

permissions:
  contents: write

concurrency:
  group: news-ingestion-step1
  cancel-in-progress: false

jobs:
  ingest-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch news metadata
        run: python scripts/update_news_raw.py

      - name: Print ingestion health summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path('data/news_source_health.json').read_text(encoding='utf-8'))
          raw = json.loads(Path('data/news_raw.json').read_text(encoding='utf-8'))
          print(json.dumps(health['summary'], indent=2, ensure_ascii=False))
          print(json.dumps(raw['stats'], indent=2, ensure_ascii=False))
          print('\nFailed checks:')
          for row in health['checks']:
              if not row['ok']:
                  print(f"- {row['source_id']}: {row.get('error') or '0 records'}")
          PY

      - name: Commit ingestion snapshot
        run: |
          cp data/news_raw.json /tmp/news_raw.json
          cp data/news_source_health.json /tmp/news_source_health.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Snapshot push attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/news_raw.json data/news_raw.json
            cp /tmp/news_source_health.json data/news_source_health.json
            git add data/news_raw.json data/news_source_health.json

            if git diff --cached --quiet; then
              echo "No news data changes to commit."
              exit 0
            fi

            git commit -m "Test news ingestion sources"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "Failed to push news snapshot after 3 attempts."
          exit 1
