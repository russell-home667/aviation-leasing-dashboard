name: Update Market Data and Deploy Pages

on:

  # Every normal code push still deploys the website
  push:
    branches:
      - main

  # Allows us to manually test the automatic update
  workflow_dispatch:

  # Daily automatic update
  # 00:30 UTC = 08:30 Singapore time
  schedule:
    - cron: '30 0 * * *'


permissions:
  contents: write
  pages: write
  id-token: write


concurrency:
  group: pages
  cancel-in-progress: false


jobs:

  update-and-deploy:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}


    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        if: >
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          contains(github.event.head_commit.message, '[seed-jet]')
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: >
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          contains(github.event.head_commit.message, '[seed-jet]')
        run: |
          python -m pip install --upgrade pip
          pip install yfinance==1.7.0 requests beautifulsoup4

      - name: Update Brent market data
        if: >
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch'
        run: |
          python scripts/update_brent.py

      - name: Update Singapore Jet Kerosene data
        if: >
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          contains(github.event.head_commit.message, '[seed-jet]')
        run: |
          python scripts/update_jet_fuel.py

      - name: Sync dashboard source labels
        if: >
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          contains(github.event.head_commit.message, '[seed-jet]')
        run: |
          python scripts/sync_dashboard_metadata.py

      - name: Save updated files
        if: >
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          contains(github.event.head_commit.message, '[seed-jet]')
        run: |
          if git diff --quiet -- data/market_data.json index.html; then
            echo "No new market data or dashboard metadata."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/market_data.json index.html
            git commit -m "Update market data"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
