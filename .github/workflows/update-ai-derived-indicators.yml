name: Update AI Derived Indicators

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/calculate_ai_derived_indicators.py'
      - 'data/ai_bubble/cloud_monetization/official_quarterly.csv'
      - '.github/workflows/update-ai-derived-indicators.yml'
  workflow_run:
    workflows:
      - 'Update AI Bubble Market & Liquidity'
      - 'Update AI Hyperscaler Financials'
      - 'Update AI Compute Fundamentals'
      - 'Update AI GPU Rental Prices'
    types: [completed]
  schedule:
    - cron: '45 0 * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: ai-derived-indicators
  cancel-in-progress: false

jobs:
  update:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install 'pandas>=2.2'

      - name: Calculate derived indicators
        run: python scripts/calculate_ai_derived_indicators.py

      - name: Validate derived indicators
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/ai_bubble/derived_indicators/latest.json')
          if not p.exists():
              raise SystemExit('derived latest.json missing')
          d = json.loads(p.read_text(encoding='utf-8'))
          if d.get('errors'):
              raise SystemExit(f"Derived errors: {d['errors']}")
          required = [
              'investment_monetization_gap','investment_cash_flow_gap',
              'price_fundamental_gap','liquidity_stress_score',
              'nvidia_demand_quality_score','compute_demand_score'
          ]
          missing = [k for k in required if k not in d.get('indicators', {})]
          if missing:
              raise SystemExit(f'Missing indicators: {missing}')
          if d['indicators']['investment_monetization_gap']['value_ppt'] is None:
              raise SystemExit('Investment–Monetization Gap unavailable')
          print(json.dumps(d['indicators'], indent=2))
          PY

      - name: Commit refreshed derived data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ai_bubble/derived_indicators/
          if git diff --cached --quiet; then
            echo 'No derived-data changes to commit.'
            exit 0
          fi
          git commit -m 'data: refresh AI derived indicators'
          git pull --rebase origin main
          git push origin HEAD:main
