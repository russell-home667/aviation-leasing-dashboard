name: Update AI GPU Rental Prices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_ai_gpu_prices.py'
      - '.github/workflows/update-ai-gpu-prices.yml'
  schedule:
    # Four Beijing-time snapshots per day.
    - cron: '0 2 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '0 8 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '0 14 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '0 20 * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: ai-gpu-rental-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'pandas>=2.2' 'requests>=2.32' 'beautifulsoup4>=4.12'

      - name: Update GPU rental price snapshots
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/update_ai_gpu_prices.py

      - name: Validate generated module
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/ai_bubble/gpu_rental_prices/latest.json')
          if not p.exists():
              raise SystemExit('latest.json missing')
          d = json.loads(p.read_text(encoding='utf-8'))
          if d.get('errors'):
              raise SystemExit(f"Pipeline errors: {d['errors']}")
          g = d.get('gpus', {})
          for name in ['H100', 'H200', 'B200']:
              if name not in g:
                  raise SystemExit(f'Missing GPU: {name}')
              if not g[name].get('daily_price_usd_per_gpu_hr'):
                  raise SystemExit(f'Missing price: {name}')
          print('Vast key configured:', d.get('vast_api_key_configured'))
          print('GPU snapshot:', {k: v.get('daily_price_usd_per_gpu_hr') for k, v in g.items()})
          PY

      - name: Commit refreshed data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ai_bubble/gpu_rental_prices/
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
            exit 0
          fi
          git commit -m 'data: refresh AI GPU rental prices'
          git pull --rebase origin main
          git push origin HEAD:main
