name: Discover Ishka RSS Links
on:
  push:
    paths:
      - '.github/workflows/discover-ishka-rss.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Print official RSS links
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          urls = [
              'https://platform.ishkaairfinance.com/Home/RssFeed',
              'https://platform.airfinanceglobal.com/Home/RssFeed',
          ]
          for url in urls:
              try:
                  r=requests.get(url,timeout=20,headers={'User-Agent':'Mozilla/5.0'})
                  print('PAGE',url,'STATUS',r.status_code,'FINAL',r.url)
                  s=BeautifulSoup(r.text,'html.parser')
                  for a in s.find_all('a',href=True):
                      text=' '.join(a.stripped_strings)
                      href=a.get('href','')
                      if 'Rss' in href or 'rss' in href or text in {'Latest news','Aircraft and Manufacturers','Airlines','Banks and Capital Markets','Law','Lessors, Funds and Private Equity','Europe','CIS','Middle East','Africa','China','South Asia','Southeast Asia','Northeast Asia','Oceania','North America','Latin America'}:
                          print(repr(text), href)
              except Exception as e:
                  print('ERROR',url,repr(e))
          PY
