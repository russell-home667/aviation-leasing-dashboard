name: Update Aviation Leasing News

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_news_raw.py'
      - 'scripts/validate_news_coverage.py'
      - 'scripts/process_news.py'
      - 'scripts/validate_processed_news.py'
      - 'scripts/analyze_news.py'
      - 'scripts/run_analyze_news_resilient.py'
      - 'scripts/backfill_news_enrichment.py'
      - 'scripts/validate_enriched_news.py'
      - 'scripts/check_news_pipeline_health.py'
      - 'scripts/install_news_ui.py'
      - 'scripts/install_news_page_filters.py'
      - 'scripts/validate_news_ui.py'
      - 'data/news_sources.json'
      - 'data/news_validation_baseline.json'
      - 'data/news_priority_entities.json'
      - 'news.html'
      - '.github/workflows/update-news.yml'
  schedule:
    # Poll hourly. Several source feeds expose only their latest items, so frequent
    # archiving is required to avoid silent headline loss.
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news-data-writer
  # Code/config pushes supersede stale code; ordinary hourly runs queue so a live
  # production update is never cancelled halfway through enrichment or deployment.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch news metadata
        run: python scripts/update_news_raw.py

      - name: Validate source coverage
        run: python scripts/validate_news_coverage.py

      - name: Process, cluster and classify news
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-flash
          NEWS_CURRENT_DAYS: '7'
          NEWS_ARCHIVE_DAYS: '120'
          NEWS_MAX_AI_CANDIDATES: '360'
          NEWS_AI_BATCH_SIZE: '30'
        run: python scripts/process_news.py

      - name: Validate processed news
        run: python scripts/validate_processed_news.py

      - name: Step 3 analyze, score and rank new/changed stories
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-flash
          NEWS_STEP3_BATCH_SIZE: '45'
          NEWS_STEP3_MAX_AI_STORIES: '260'
        run: python scripts/run_analyze_news_resilient.py

      - name: Step 5 backfill historical AI enrichment
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-flash
          NEWS_BACKFILL_BATCH_SIZE: '6'
          NEWS_BACKFILL_MAX_STORIES: '48'
        run: python scripts/backfill_news_enrichment.py

      - name: Validate enriched news
        run: python scripts/validate_enriched_news.py

      - name: Install homepage news module
        run: python scripts/install_news_ui.py

      - name: Install full news page deep links
        run: python scripts/install_news_page_filters.py

      - name: Validate dashboard news UI
        run: python scripts/validate_news_ui.py

      - name: Step 5 operational health gate
        run: python scripts/check_news_pipeline_health.py

      - name: Publish pipeline summary to Actions
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          h = json.loads(Path('data/news_pipeline_health.json').read_text(encoding='utf-8'))
          e = json.loads(Path('data/news_enrichment_status.json').read_text(encoding='utf-8'))
          f = json.loads(Path('data/news_feed.json').read_text(encoding='utf-8'))
          print('## Aviation Leasing News Pipeline')
          print(f"- Operational status: **{h.get('status')}**")
          print(f"- Source checks: **{h.get('source_checks', {}).get('ok')}/{h.get('source_checks', {}).get('total')}**")
          print(f"- Ishka baseline recall: **{h.get('coverage', {}).get('ishka_baseline_recall')}**")
          print(f"- Current clustered stories: **{len(f.get('stories', []))}**")
          print(f"- Critical: **{f.get('stats', {}).get('critical_stories')}**")
          print(f"- Priority customer/prospect stories: **{f.get('stats', {}).get('priority_entity_stories')}**")
          print(f"- Macro-related stories: **{f.get('stats', {}).get('macro_related_stories')}**")
          print(f"- DeepSeek current / fallback current: **{e.get('deepseek_story_count')} / {e.get('fallback_story_count')}**")
          warnings = h.get('warnings') or []
          if warnings:
              print('- Warnings:')
              for w in warnings:
                  print(f"  - {w}")
          PY

      - name: Commit last-known-good news snapshot
        run: |
          cp data/news_raw.json /tmp/news_raw.json
          cp data/news_source_health.json /tmp/news_source_health.json
          cp data/news_coverage.json /tmp/news_coverage.json
          cp data/news.json /tmp/news.json
          cp data/news_archive.json /tmp/news_archive.json
          cp data/news_processing_status.json /tmp/news_processing_status.json
          cp data/news_feed.json /tmp/news_feed.json
          cp data/news_feed_archive.json /tmp/news_feed_archive.json
          cp data/news_enrichment_status.json /tmp/news_enrichment_status.json
          cp data/news_pipeline_health.json /tmp/news_pipeline_health.json
          cp index.html /tmp/index.html
          cp news.html /tmp/news.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "News snapshot push attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/news_raw.json data/news_raw.json
            cp /tmp/news_source_health.json data/news_source_health.json
            cp /tmp/news_coverage.json data/news_coverage.json
            cp /tmp/news.json data/news.json
            cp /tmp/news_archive.json data/news_archive.json
            cp /tmp/news_processing_status.json data/news_processing_status.json
            cp /tmp/news_feed.json data/news_feed.json
            cp /tmp/news_feed_archive.json data/news_feed_archive.json
            cp /tmp/news_enrichment_status.json data/news_enrichment_status.json
            cp /tmp/news_pipeline_health.json data/news_pipeline_health.json
            cp /tmp/index.html index.html
            cp /tmp/news.html news.html
            git add data/news_raw.json data/news_source_health.json data/news_coverage.json data/news.json data/news_archive.json data/news_processing_status.json data/news_feed.json data/news_feed_archive.json data/news_enrichment_status.json data/news_pipeline_health.json index.html news.html

            if git diff --cached --quiet; then
              echo "No news data changes to commit."
              exit 0
            fi

            git commit -m "Update aviation leasing news pipeline"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "Failed to push news snapshot after 3 attempts."
          exit 1

  deploy-news-pages:
    needs: update-news
    if: ${{ needs.update-news.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout committed main snapshot
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy current news snapshot to Pages
        id: deployment
        uses: actions/deploy-pages@v4
