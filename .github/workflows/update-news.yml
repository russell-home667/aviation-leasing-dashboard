name: Update Aviation Leasing News

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_news_raw.py'
      - 'scripts/validate_news_coverage.py'
      - 'scripts/process_news.py'
      - 'scripts/validate_processed_news.py'
      - 'scripts/analyze_news.py'
      - 'scripts/run_analyze_news_resilient.py'
      - 'scripts/validate_enriched_news.py'
      - 'scripts/install_news_ui.py'
      - 'scripts/install_news_page_filters.py'
      - 'scripts/validate_news_ui.py'
      - 'data/news_sources.json'
      - 'data/news_validation_baseline.json'
      - 'data/news_priority_entities.json'
      - 'news.html'
      - '.github/workflows/update-news.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: news-data-writer
  # A code/config push should supersede stale code currently running. Ordinary hourly
  # schedules queue instead of cancelling an active production run.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch news metadata
        run: python scripts/update_news_raw.py

      - name: Validate source coverage
        run: python scripts/validate_news_coverage.py

      - name: Process, cluster and classify news
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-flash
          NEWS_CURRENT_DAYS: '7'
          NEWS_ARCHIVE_DAYS: '120'
          NEWS_MAX_AI_CANDIDATES: '360'
          NEWS_AI_BATCH_SIZE: '30'
        run: python scripts/process_news.py

      - name: Validate processed news
        run: python scripts/validate_processed_news.py

      - name: Step 3 analyze, score and rank news
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-flash
          NEWS_STEP3_BATCH_SIZE: '45'
          NEWS_STEP3_MAX_AI_STORIES: '260'
        run: python scripts/run_analyze_news_resilient.py

      - name: Validate Step 3 enriched news
        run: python scripts/validate_enriched_news.py

      - name: Install homepage news module
        run: python scripts/install_news_ui.py

      - name: Install full news page deep links
        run: python scripts/install_news_page_filters.py

      - name: Validate Step 4 dashboard news UI
        run: python scripts/validate_news_ui.py

      - name: Print news pipeline summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path('data/news_source_health.json').read_text(encoding='utf-8'))
          coverage = json.loads(Path('data/news_coverage.json').read_text(encoding='utf-8'))
          raw = json.loads(Path('data/news_raw.json').read_text(encoding='utf-8'))
          processed = json.loads(Path('data/news.json').read_text(encoding='utf-8'))
          status = json.loads(Path('data/news_processing_status.json').read_text(encoding='utf-8'))
          enriched = json.loads(Path('data/news_feed.json').read_text(encoding='utf-8'))
          step3 = json.loads(Path('data/news_enrichment_status.json').read_text(encoding='utf-8'))
          print('Health:', json.dumps(health['summary'], ensure_ascii=False))
          print('Coverage:', json.dumps({
              'status': coverage['overall_status'],
              'ishka_recall': coverage['known_ishka_recall']['recall'],
              'failed': coverage['failed_requirements'],
              'warnings': coverage['warnings'],
          }, ensure_ascii=False))
          print('Raw stored:', raw['stats']['stored_total'])
          print('Step 2:', json.dumps({
              'analysis_mode': processed.get('analysis_mode'),
              'model': processed.get('model'),
              'stories': processed.get('stats', {}).get('stories'),
              'by_category': processed.get('stats', {}).get('by_category'),
              'deepseek_configured': status.get('deepseek_configured'),
              'deepseek_calls': status.get('deepseek_calls'),
              'deepseek_errors': status.get('deepseek_errors'),
          }, ensure_ascii=False))
          print('Step 3/4:', json.dumps({
              'analysis_mode': enriched.get('analysis_mode'),
              'stories': enriched.get('stats', {}).get('stories'),
              'critical': enriched.get('stats', {}).get('critical_stories'),
              'priority_entity_stories': enriched.get('stats', {}).get('priority_entity_stories'),
              'macro_related_stories': enriched.get('stats', {}).get('macro_related_stories'),
              'homepage_feed': len(enriched.get('homepage', {}).get('feed_story_ids', [])),
              'homepage_critical': len(enriched.get('homepage', {}).get('critical_story_ids', [])),
              'deepseek_calls': step3.get('deepseek_calls'),
              'deepseek_failed_batches': step3.get('deepseek_failed_batches'),
          }, ensure_ascii=False))
          PY

      - name: Commit news snapshot
        run: |
          cp data/news_raw.json /tmp/news_raw.json
          cp data/news_source_health.json /tmp/news_source_health.json
          cp data/news_coverage.json /tmp/news_coverage.json
          cp data/news.json /tmp/news.json
          cp data/news_archive.json /tmp/news_archive.json
          cp data/news_processing_status.json /tmp/news_processing_status.json
          cp data/news_feed.json /tmp/news_feed.json
          cp data/news_feed_archive.json /tmp/news_feed_archive.json
          cp data/news_enrichment_status.json /tmp/news_enrichment_status.json
          cp index.html /tmp/index.html
          cp news.html /tmp/news.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "News snapshot push attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/news_raw.json data/news_raw.json
            cp /tmp/news_source_health.json data/news_source_health.json
            cp /tmp/news_coverage.json data/news_coverage.json
            cp /tmp/news.json data/news.json
            cp /tmp/news_archive.json data/news_archive.json
            cp /tmp/news_processing_status.json data/news_processing_status.json
            cp /tmp/news_feed.json data/news_feed.json
            cp /tmp/news_feed_archive.json data/news_feed_archive.json
            cp /tmp/news_enrichment_status.json data/news_enrichment_status.json
            cp /tmp/index.html index.html
            cp /tmp/news.html news.html
            git add data/news_raw.json data/news_source_health.json data/news_coverage.json data/news.json data/news_archive.json data/news_processing_status.json data/news_feed.json data/news_feed_archive.json data/news_enrichment_status.json index.html news.html

            if git diff --cached --quiet; then
              echo "No news data changes to commit."
              exit 0
            fi

            git commit -m "Update aviation leasing news pipeline"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "Failed to push news snapshot after 3 attempts."
          exit 1
