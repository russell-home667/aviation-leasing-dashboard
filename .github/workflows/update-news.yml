name: Update Aviation Leasing News

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_news_raw.py'
      - 'scripts/validate_news_coverage.py'
      - 'scripts/process_news.py'
      - 'scripts/validate_processed_news.py'
      - 'data/news_sources.json'
      - 'data/news_validation_baseline.json'
      - '.github/workflows/update-news.yml'
  schedule:
    # Hourly ingestion. Frequent polling is important because some feeds expose only
    # the latest 10 items per category; archiving each run reduces headline loss.
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: news-data-writer
  # New code/data runs supersede older queued/running news jobs. This prevents a slow
  # AI bootstrap from blocking corrected pipeline versions behind it.
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch news metadata
        run: python scripts/update_news_raw.py

      - name: Validate source coverage
        run: python scripts/validate_news_coverage.py

      - name: Process, cluster and classify news
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-flash
          NEWS_CURRENT_DAYS: '7'
          NEWS_ARCHIVE_DAYS: '120'
          NEWS_MAX_AI_CANDIDATES: '360'
          NEWS_AI_BATCH_SIZE: '30'
        run: python scripts/process_news.py

      - name: Validate processed news
        run: python scripts/validate_processed_news.py

      - name: Print news pipeline summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path('data/news_source_health.json').read_text(encoding='utf-8'))
          coverage = json.loads(Path('data/news_coverage.json').read_text(encoding='utf-8'))
          raw = json.loads(Path('data/news_raw.json').read_text(encoding='utf-8'))
          processed = json.loads(Path('data/news.json').read_text(encoding='utf-8'))
          status = json.loads(Path('data/news_processing_status.json').read_text(encoding='utf-8'))
          print('Health:', json.dumps(health['summary'], ensure_ascii=False))
          print('Coverage:', json.dumps({
              'status': coverage['overall_status'],
              'ishka_recall': coverage['known_ishka_recall']['recall'],
              'failed': coverage['failed_requirements'],
              'warnings': coverage['warnings'],
          }, ensure_ascii=False))
          print('Raw stored:', raw['stats']['stored_total'])
          print('Processed:', json.dumps({
              'analysis_mode': processed.get('analysis_mode'),
              'model': processed.get('model'),
              'stories': processed.get('stats', {}).get('stories'),
              'by_category': processed.get('stats', {}).get('by_category'),
              'deepseek_configured': status.get('deepseek_configured'),
              'deepseek_calls': status.get('deepseek_calls'),
              'deepseek_errors': status.get('deepseek_errors'),
          }, ensure_ascii=False))
          PY

      - name: Commit news snapshot
        run: |
          cp data/news_raw.json /tmp/news_raw.json
          cp data/news_source_health.json /tmp/news_source_health.json
          cp data/news_coverage.json /tmp/news_coverage.json
          cp data/news.json /tmp/news.json
          cp data/news_archive.json /tmp/news_archive.json
          cp data/news_processing_status.json /tmp/news_processing_status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "News snapshot push attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/news_raw.json data/news_raw.json
            cp /tmp/news_source_health.json data/news_source_health.json
            cp /tmp/news_coverage.json data/news_coverage.json
            cp /tmp/news.json data/news.json
            cp /tmp/news_archive.json data/news_archive.json
            cp /tmp/news_processing_status.json data/news_processing_status.json
            git add data/news_raw.json data/news_source_health.json data/news_coverage.json data/news.json data/news_archive.json data/news_processing_status.json

            if git diff --cached --quiet; then
              echo "No news data changes to commit."
              exit 0
            fi

            git commit -m "Update aviation leasing news pipeline"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo "Failed to push news snapshot after 3 attempts."
          exit 1
