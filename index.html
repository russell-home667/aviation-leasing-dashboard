<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
Aircraft Leasing Market Dashboard
</title>

<script
src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js">
</script>


<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  background:
  radial-gradient(
    circle at 50% 0%,
    #14253a 0%,
    #08111d 38%,
    #030811 100%
  );

  color: #eaf7ff;

  font-family:
  Arial,
  "Microsoft YaHei",
  sans-serif;

  min-height: 100vh;

}


.dashboard {

  width: 96%;
  max-width: 1600px;

  margin: auto;

  padding: 24px;

}


.header {

  text-align: center;

  margin-bottom: 24px;

}


.header h1 {

  margin: 0;

  font-size: 32px;

  letter-spacing: 3px;

}


.header p {

  margin-top: 8px;

  color: #7da2bd;

  font-size: 14px;

}


.demo {

  display: inline-block;

  margin-left: 8px;

  padding: 3px 8px;

  border-radius: 4px;

  font-size: 11px;

  background: #784a00;

  color: #ffd891;

}


.kpi-grid {

  display: grid;

  grid-template-columns:
  repeat(3, 1fr);

  gap: 18px;

  margin-bottom: 20px;

}


.card {

  background:
  rgba(9,24,40,0.86);

  border:
  1px solid
  rgba(70,193,255,0.32);

  border-radius: 10px;

  padding: 20px;

  box-shadow:
  0 0 18px
  rgba(0,156,255,0.08);

}


.kpi-title {

  color: #8eaabe;

  font-size: 14px;

  margin-bottom: 12px;

}


.kpi-value {

  font-size: 34px;

  font-weight: bold;

  margin-bottom: 8px;

}


.kpi-change {

  font-size: 14px;

}


.up {

  color: #47d7a3;

}


.down {

  color: #ff718b;

}


.chart-grid {

  display: grid;

  grid-template-columns:
  2fr 1fr;

  gap: 18px;

}


.chart-title {

  font-size: 16px;

  font-weight: bold;

  margin-bottom: 10px;

}


#energyChart,
#freightChart {

  width: 100%;

  height: 420px;

}


.footer {

  margin-top: 20px;

  text-align: right;

  color: #61798c;

  font-size: 12px;

}


@media(max-width:900px) {

  .kpi-grid,
  .chart-grid {

    grid-template-columns: 1fr;

  }

}

</style>

</head>



<body>


<div class="dashboard">


<div class="header">

<h1>
AIRCRAFT LEASING MARKET DASHBOARD
</h1>

<p>

航空租赁市场监测

<span class="demo">
BRENT LIVE · JET FUEL & BAI00 DEMO
</span>

<br>

Last Update:
<span id="lastUpdate">
Loading...
</span>

</p>

</div>



<div class="kpi-grid">


<div class="card">

<div class="kpi-title">
BRENT CRUDE
</div>

<div
class="kpi-value"
id="brentValue">
--
</div>

<div
class="kpi-change"
id="brentChange">
--
</div>

</div>



<div class="card">

<div class="kpi-title">
SINGAPORE JET KEROSENE
</div>

<div
class="kpi-value"
id="jetValue">
--
</div>

<div
class="kpi-change"
id="jetChange">
--
</div>

</div>



<div class="card">

<div class="kpi-title">
BALTIC AIR FREIGHT INDEX
</div>

<div
class="kpi-value"
id="baiValue">
--
</div>

<div
class="kpi-change"
id="baiChange">
--
</div>

</div>


</div>



<div class="chart-grid">


<div class="card">

<div class="chart-title">
ENERGY MARKET TREND
</div>

<div id="energyChart"></div>

</div>



<div class="card">

<div class="chart-title">
BAI00 TREND
</div>

<div id="freightChart"></div>

</div>


</div>



<div class="footer">

Data source:
Yahoo Finance · CME · TAC Index

</div>


</div>



<script>


const energyChart =
echarts.init(
document.getElementById(
"energyChart"
)
);


const freightChart =
echarts.init(
document.getElementById(
"freightChart"
)
);



function getChange(series) {

  if (
    !series ||
    series.length < 2
  ) {

    return null;

  }

  const latest =
  series[
    series.length - 1
  ].value;


  const previous =
  series[
    series.length - 2
  ].value;


  return (
    (latest / previous - 1)
    * 100
  );

}



function updateChange(
elementId,
change,
period
) {

  const el =
  document.getElementById(
    elementId
  );


  if (change === null) {

    el.textContent = "--";

    return;

  }


  if (change >= 0) {

    el.className =
    "kpi-change up";

    el.textContent =
    "▲ "
    +
    change.toFixed(2)
    +
    "% "
    +
    period;

  }

  else {

    el.className =
    "kpi-change down";

    el.textContent =
    "▼ "
    +
    Math.abs(change)
    .toFixed(2)
    +
    "% "
    +
    period;

  }

}



async function loadData() {


try {


const response =
await fetch(
"./data/market_data.json?t="
+
Date.now()
);


if (!response.ok) {

throw new Error(
"Failed to load market data"
);

}


const market =
await response.json();



/* =========================
   HEADER
========================= */

document
.getElementById(
"lastUpdate"
)
.textContent =
market.updated_at;



/* =========================
   KPI
========================= */


const brent =
market.brent.data;


const jet =
market.jet_fuel.data;


const bai =
market.bai00.data;



const brentLatest =
brent[
brent.length - 1
].value;


const jetLatest =
jet[
jet.length - 1
].value;


const baiLatest =
bai[
bai.length - 1
].value;



document
.getElementById(
"brentValue"
)
.textContent =
"$"
+
brentLatest.toFixed(2);



document
.getElementById(
"jetValue"
)
.textContent =
"$"
+
jetLatest.toFixed(2);



document
.getElementById(
"baiValue"
)
.textContent =
baiLatest.toLocaleString();



updateChange(
"brentChange",
getChange(brent),
"DoD"
);


updateChange(
"jetChange",
getChange(jet),
"DoD"
);


updateChange(
"baiChange",
getChange(bai),
"WoW"
);



/* =========================
   ENERGY CHART
========================= */


const energyDates =
[
...new Set(

[
...brent.map(
x => x.date
),

...jet.map(
x => x.date
)

]

)
]
.sort();



const brentMap =
Object.fromEntries(
brent.map(
x => [
x.date,
x.value
]
)
);



const jetMap =
Object.fromEntries(
jet.map(
x => [
x.date,
x.value
]
)
);



energyChart.setOption({

tooltip: {

trigger: "axis"

},


legend: {

data: [

"Brent",

"Singapore Jet Fuel"

],

textStyle: {

color: "#bfd3df"

}

},


grid: {

left: "8%",

right: "4%",

top: "15%",

bottom: "12%"

},


xAxis: {

type: "time",

data:
energyDates,


axisLine: {

lineStyle: {

color: "#466277"

}

},


axisLabel: {

color: "#8fa7b7"

}

},


yAxis: {

type: "value",

name: "USD/bbl",


nameTextStyle: {

color: "#7790a2"

},


splitLine: {

lineStyle: {

color:
"rgba(130,160,180,0.10)"

}

},


axisLabel: {

color: "#8fa7b7"

}

},


series: [


{
  name: "Brent",
  type: "line",
  smooth: true,
  connectNulls: true,
  symbolSize: 7,
  lineStyle: {
    width: 3
  },
  data:
  energyDates.map(
    date =>
    brentMap[date]
    ?? null
  )
},



{
  name: "Singapore Jet Fuel",
  type: "line",
  smooth: true,
  connectNulls: true,
  symbolSize: 7,
  lineStyle: {
    width: 3
  },
  data:
  energyDates.map(
    date =>
    jetMap[date]
    ?? null
  )
}


]


});



/* =========================
   BAI00
========================= */


freightChart.setOption({


tooltip: {

trigger: "axis"

},


grid: {

left: "15%",

right: "5%",

top: "12%",

bottom: "12%"

},


xAxis: {

type: "category",

data:
bai.map(
x => x.date
),


axisLine: {

lineStyle: {

color: "#466277"

}

},


axisLabel: {

color: "#8fa7b7"

}

},


yAxis: {

type: "value",

name: "Index",


nameTextStyle: {

color: "#7790a2"

},


splitLine: {

lineStyle: {

color:
"rgba(130,160,180,0.10)"

}

},


axisLabel: {

color: "#8fa7b7"

}

},


series: [


{

name: "BAI00",

type: "line",

smooth: true,

areaStyle: {

opacity: 0.10

},

lineStyle: {

width: 3

},

data:
bai.map(
x => x.value
)

}


]


});


}


catch(error) {


console.error(error);


document
.getElementById(
"lastUpdate"
)
.textContent =
"DATA ERROR";


}


}



loadData();



window.addEventListener(
"resize",
function() {

energyChart.resize();

freightChart.resize();

}
);


</script>


</body>

</html>
